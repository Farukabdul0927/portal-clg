<!DOCTYPE html>

<html>
<head>
    <title>Student Profile</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        text-align: center;
        padding: 40px;
    }

    .profile-box {
        background: white;
        max-width: 500px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
        margin-bottom: 25px;
    }

    .info {
        text-align: left;
        margin: 15px 0;
        padding: 12px;
        background: #f1f3f5;
        border-radius: 8px;
    }

    a {
        text-decoration: none;
    }

    .button {
        display: inline-block;
        margin: 10px 5px;
        padding: 12px 20px;
        border-radius: 8px;
        background: #333;
        color: white;
    }

    .account {
        background: #007bff;
    }
</style>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/classic-ui.css') }}">
</head>

<body class="classic-page">
{% include "sidebar.html" %}
<main class="portal-main">

<div class="profile-box">


<h1>👤 Student Profile</h1>

<h2>{{ student.name }}</h2>

<div class="info">
    <strong>Roll Number:</strong> {{ student.roll_number }}
</div>

<div class="info">
    <strong>Username:</strong> {{ student.username }}
</div>

<div class="info">
    <strong>Class:</strong> {{ student.class_name }}
</div>

<br>

<a href="/dashboard" class="button">
    ⬅ Back to Dashboard
</a>

<a href="/student-account" class="button account">
    ⚙️ Account Settings
</a>


</div>

</main>
</body>
</html>
