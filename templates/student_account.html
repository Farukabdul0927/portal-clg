<!DOCTYPE html>

<html>
<head>
    <title>Account Settings</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        text-align: center;
        padding: 40px;
    }

    .box {
        background: white;
        max-width: 450px;
        margin: auto;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
        margin-bottom: 25px;
    }

    label {
        display: block;
        text-align: left;
        margin-top: 15px;
        font-weight: bold;
    }

    .password-box {
        position: relative;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-top: 7px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    .eye {
        position: absolute;
        right: 10px;
        top: 14px;
        border: none;
        background: none;
        cursor: pointer;
        font-size: 20px;
    }

    .save {
        width: 100%;
        margin-top: 25px;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        color: #333;
    }
</style>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/classic-ui.css') }}">
</head>

<body class="classic-page">
{% include "sidebar.html" %}
<main class="portal-main">

<div class="box">


<h1>⚙️ Account Settings</h1>

<form method="POST" action="/student-account">

    <label>Username</label>
    <input
        type="text"
        name="username"
        value="{{ student.username }}"
        required
    >

    <label>Password</label>

    <div class="password-box">
        <input
            type="password"
            id="password"
            name="password"
            value="{{ student.password }}"
            required
        >

        <button
            type="button"
            class="eye"
            onclick="togglePassword()"
            id="eyeButton"
        >👁️</button>
    </div>

    <button type="submit" class="save">
        💾 Save Changes
    </button>

</form>

<a href="/profile" class="back">
    ⬅ Back to Profile
</a>


</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eyeButton = document.getElementById("eyeButton");

    if (password.type === "password") {
        password.type = "text";
        eyeButton.innerHTML = "🙈";
    } else {
        password.type = "password";
        eyeButton.innerHTML = "👁️";
    }
}
</script>

</main>
</body>
</html>
